.top{display:flex;justify-content:space-between;align-items:flex-start;padding:30px 28px 0}
.brand{text-shadow:0 1px 10px rgba(0,0,0,.9);font:600 1.25rem 'Barlow Condensed',sans-serif;letter-spacing:.32em}
.brand small{display:block;font:600 .64rem Barlow,sans-serif;letter-spacing:.16em;color:#8fd0ff;margin-top:2px}
.mark{width:46px;height:46px}
.hero{text-align:center;padding:0 28px 6px;text-shadow:0 2px 14px rgba(0,0,0,.8)}
.star{width:26px;height:26px;margin:0 auto 14px;display:block}
h1{margin:0;font:600 clamp(2rem,9vw,2.6rem) 'Barlow Condensed',sans-serif;letter-spacing:.14em;text-transform:uppercase;overflow-wrap:anywhere}
.role{color:var(--blue);font:500 .8rem Barlow,sans-serif;letter-spacing:.22em;text-transform:uppercase;margin-top:6px}
.tag{margin:18px 0 0;color:var(--mute);font-size:.8rem;letter-spacing:.2em;text-transform:uppercase}
.div{display:flex;align-items:center;gap:10px;margin:14px 40px}.div i{flex:1;height:1px;background:var(--blue)}
.div svg{width:16px;height:16px}
.rows{display:flex;flex-wrap:nowrap;justify-content:center;align-items:center;gap:18px;padding:0 28px 26px}
.row{display:flex;align-items:center;gap:16px;text-decoration:none;color:var(--ink);min-width:0}
.ic{flex:none;width:46px;height:46px;border:1.5px solid var(--blue);border-radius:50%;display:grid;place-items:center;background:rgba(58,155,224,.08)}
.ic svg{width:21px;height:21px;fill:none;stroke:var(--blue);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.row span{font-size:1.02rem;overflow-wrap:anywhere;min-width:0}.row small{display:block;color:var(--mute);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase}
.row:active .ic,.row:hover .ic{background:rgba(58,155,224,.22)}

<main class="card" id="card"></main>
<script>
/* ===== MEMBER DATA: add one entry per member. The key is the id used in the QR link (lowercase, no spaces). ===== */
var MEMBERS={"shagun-gupta":{"name":"SHAGUN\u003cbr\u003eGUPTA","role":"WEBDEV \u00b7 CORE","memberId":"AC-26-022","phone":"9193652227","email":"shagung072@gmail.com","linkedin":"https://www.linkedin.com/in/shagun-gupta-8a3a6732b","instagram":"https://instagram.com/shagung072","tagline":"LOOK UP. WONDER BIG."}};
/* ================================================================================================================ */
var ICON={
 phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
 mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
 li:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 10v7M8 7v.01M12 17v-4a2 2 0 0 1 4 0v4M12 10v7"/>',
 ig:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5v.01"/>'};

function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function appendName(target,value){String(value||'').split(/<br\s*\/?\s*>/i).forEach(function(part,index){if(index)target.appendChild(document.createElement('br'));target.appendChild(document.createTextNode(part.trim()))})}
function clean(h){return String(h||'').replace(/^@/,'').replace(/^https?:\/\/[^\/]*\//i,'').replace(/\/+$/,'').trim()}
function row(icon,label,text,href){var a=el('a','row');a.href=href;if(/^http/.test(href)){a.target='_blank';a.rel='noopener'}
  var i=el('div','ic');i.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+ICON[icon]+'</svg>';
  a.setAttribute('aria-label',label);a.title=label;a.appendChild(i);return a}
function render(){

      q=new URLSearchParams(location.search).get('id')||location.hash.replace('#','');

  var m=Object.prototype.hasOwnProperty.call(MEMBERS,id)?MEMBERS[id]:null;

  h.appendChild(el('p','tag',m.tagline||'Look up. Wonder big.'));stage.appendChild(h);card.appendChild(stage);
  var d=el('div','div');d.innerHTML='<i></i>'+STAR.replace('class="star"','').replace('<svg','<svg')+'<i></i>';card.appendChild(d);
  var r=el('div','rows');
  if(m.phone)r.appendChild(row('phone','Phone',m.phone,'tel:'+m.phone.replace(/[^\d+]/g,'')));
  if(m.linkedin){var li=String(m.linkedin).trim(),liHref=/^https?:\/\//i.test(li)?li:'https://www.linkedin.com/in/'+clean(li);var liLabel=li.replace(/^https?:\/\/[^/]+\/?/i,'').split(/[?#]/)[0].replace(/\/+$/,'');r.appendChild(row('li','LinkedIn',liLabel,'https://'+liHref.replace(/^https?:\/\//i,'')));}

  card.appendChild(r);
  if(m.memberId)card.appendChild(el('div','id',m.memberId));
  card.appendChild(el('div','bar'));
}
render();
</script>
